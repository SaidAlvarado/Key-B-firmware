# Redraws keymap-drawer/keyb.svg (and a PNG copy) whenever the keymap or the physical layout
# changes, and commits the result back to the branch.
name: Draw keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "boards/*/*/*-layout.dtsi"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw.yml"

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow workflow to commit to the repo
    steps:
      - uses: actions/checkout@v7

      - name: Install keymap-drawer and rsvg-convert
        run: |
          pipx install keymap-drawer==0.23.0
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Draw keymap
        run: |
          mkdir -p keymap-drawer
          keymap -c keymap_drawer.config.yaml parse -z config/keyb.keymap > keymap-drawer/keyb.yaml
          keymap -c keymap_drawer.config.yaml draw keymap-drawer/keyb.yaml \
            -d boards/saidalvarado/keyb/keyb-layout.dtsi -o keymap-drawer/keyb.svg
          # Background matches svg_extra_style in keymap_drawer.config.yaml
          rsvg-convert -b '#22272e' -z 1.5 keymap-drawer/keyb.svg -o keymap-drawer/keyb.png

      - name: Commit drawings
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "keymap-drawer render"
          file_pattern: "keymap-drawer/keyb.yaml keymap-drawer/keyb.svg keymap-drawer/keyb.png"
